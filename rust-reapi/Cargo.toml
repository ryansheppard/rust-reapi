[package]
name = "rust_reapi"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "*"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "*"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net"] }
remote_execution_proto = { path = "../rust-reapi-proto/" }
anyhow = "1.0.100"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protoc-gen-prost = "0.5"
protoc-gen-tonic = "0.5"
